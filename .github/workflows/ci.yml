name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Spotless and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept the Android SDK licenses
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses | tail -n 3

      - uses: gradle/actions/setup-gradle@v4

      - name: Check format and run tests
        run: ./gradlew spotlessCheck :domain:test :data:test :app:testDebugUnitTest --stacktrace

      - name: Upload reports if something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
